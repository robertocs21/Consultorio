# Configuración de Apache del consultorio

ServerName localhost

# No anunciar la versión de Apache ni del sistema
ServerTokens Prod
ServerSignature Off

# Permite que public/.htaccess defina las rutas y el bloqueo de peticiones multipart
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# El plan de DigitalOcean tiene 512 MB: pocos procesos de Apache, y cada uno se recicla de vez en cuando
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       12
    MaxConnectionsPerChild 1000
</IfModule>
