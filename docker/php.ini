; Ajustes de PHP del consultorio (se cargan después de php.ini-production)

; El código lee la conexión a la base (DB_HOST, DB_USER...) de $_ENV; la "E" hace que PHP
; llene $_ENV con las variables de entorno que define DigitalOcean
variables_order = "EGPCS"

; Mitigación de php2shell que PHP recomienda mantener aun con la versión corregida.
; Con Apache + mod_php no se lee public/.user.ini, por eso van aquí
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; No anunciar la versión de PHP en las respuestas
expose_php = Off
